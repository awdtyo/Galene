<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Galene — Marine Intelligence</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <span class="logo">🌊</span>
    <h1>Galene <span class="tag">· Marine Intelligence for fishers, researchers & coastal authorities</span></h1>
    <div id="alert">⚓ No query yet.</div>
  </header>
  <main>
    <section id="mapwrap">
      <div id="map"></div>
      <div id="layers">
        <label><input type="checkbox" id="lyr-eez" checked /> EEZ</label>
        <label><input type="checkbox" id="lyr-mpa" checked /> MPAs</label>
        <label><input type="checkbox" id="lyr-pfz" checked /> PFZ</label>
        <label><input type="checkbox" id="lyr-sat" /> Satellite</label>
        <label><input type="checkbox" id="lyr-labels" checked /> Labels</label>
        <label><input type="checkbox" id="lyr-ports" checked /> Ports</label>
        <label><input type="checkbox" id="lyr-seas" checked /> Seas</label>
        <span id="loc">lat 15.00, lon 74.00 (click map to move)</span>
      </div>
      <div id="chartwrap"><canvas id="chart" height="120"></canvas><div id="charttip"></div><div id="chartcap">48h tide / wave / wind — hover for values</div></div>
    </section>
    <section id="chatwrap">
      <div id="chat"></div>
      <form id="form">
        <input id="q" autocomplete="off" placeholder="Is it safe tomorrow morning? Try: Compare Kochi vs Chennai…" />
        <button>Ask 🌊</button>
      </form>
      <details id="tracebox"><summary>🔍 Evidence &amp; trace</summary><div id="trace"></div></details>
    </section>
  </main>
  <footer>Galene · SIH 2026 · EEZ/WDPA boundaries simplified — not for navigation</footer>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
