# Galene on Render (free Web Service) — Blueprint.
# Non-secret defaults are baked in; secrets are filled in the dashboard (sync: false).
services:
  - type: web
    name: galene
    runtime: python
    buildCommand: pip install .
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ORCA_LLM_PROVIDER
        value: groq
      - key: ORCA_LLM_MODEL
        value: openai/gpt-oss-120b
      - key: ORCA_LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: ORCA_LLM_API_KEY
        sync: false
      - key: ORCA_COPERNICUS_CLIENT_ID
        sync: false
      - key: ORCA_COPERNICUS_CLIENT_SECRET
        sync: false
